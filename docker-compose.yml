version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: linq_postgres
    environment:
      POSTGRES_USER: linq_user
      POSTGRES_PASSWORD: linq_password
      POSTGRES_DB: linq_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linq_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: