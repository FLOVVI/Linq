# То же, что caviar_2cam.yaml, но с результатом `python -m safetyvision calibrate configs/caviar_2cam.yaml`:
# модели камер и их места на карте заданы явно, карта и общие ID людей есть с первого кадра.
#   python -m safetyvision run configs/caviar_2cam_calibrated.yaml --save-video runs/caviar/demo.mp4
site:
  id: caviar
  name: "CAVIAR — коридор"
  map: {size_m: [30, 20], px_per_m: 20, auto_fit: true}
  rules: {running: 1, danger_zone: 1, fall: 1}

models:
  backend: onnx
  pose: {spec: ../models/pose_v8n_384x640.json, conf: 0.3}

cameras:
  - id: cor
    name: "Коридор"
    source: ../data/videos/caviar/ThreePastShop1cor.mpg
    process_fps: 8
    calibration:
      camera: {f: 461.1962, tilt_deg: 22.7874, roll_deg: -1.4963, height_m: 3.7152, cx: 192.0, cy: 144.0}
      placement: {x: 0.0, y: 0.0, yaw_deg: 0.0}
  - id: front
    name: "Фронт"
    source: ../data/videos/caviar/ThreePastShop1front.mpg
    process_fps: 8
    start_offset_s: -3.12
    calibration:
      camera: {f: 454.2584, tilt_deg: 6.1751, roll_deg: -0.3517, height_m: 1.8812, cx: 192.0, cy: 144.0}
      placement: {x: 9.19, y: 10.872, yaw_deg: 125.59}

events:
  output_dir: ../runs/caviar
  pre_roll_s: 2
  post_roll_s: 1
